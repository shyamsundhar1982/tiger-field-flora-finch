name: Cloudflare lockfile refresh

on:
  push:
    branches:
      - performance/cloudflare-vite-hyperdrive-runtime
    paths:
      - package.json
      - .github/workflows/cloudflare-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: performance/cloudflare-vite-hyperdrive-runtime
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve declared dependencies into package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for Cloudflare Worker runtime"
          git push origin HEAD:performance/cloudflare-vite-hyperdrive-runtime
