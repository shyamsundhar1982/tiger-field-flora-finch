name: Cloudflare runtime verify

on:
  push:
    branches:
      - performance/cloudflare-vite-hyperdrive-runtime

permissions:
  contents: read

jobs:
  verify-worker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Authentication invariant gate
        run: npm run check:auth -- --ci
      - name: Route invariant gate
        run: npm run check:routes
      - name: Cloudflare Worker build and typecheck
        run: npm run typecheck
      - name: Client bundle invariant gate
        run: node scripts/check-client-bundle.mjs
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
