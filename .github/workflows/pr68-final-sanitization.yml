name: PR68 Final Sanitation

on:
  push:
    branches:
      - hotfix-auth-runtime-vibpe-2026-09-09
    paths:
      - scripts/apply-pr68-final-sanitization.mjs
      - .github/workflows/pr68-final-sanitization.yml

permissions:
  contents: write

jobs:
  sanitize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR68 branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-auth-runtime-vibpe-2026-09-09

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic sanitation
        run: node scripts/apply-pr68-final-sanitization.mjs

      - name: Correct generated compatibility assertions and typed ledger route
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const checkPath = "scripts/check-route-invariants.mjs";
          let source = readFileSync(checkPath, "utf8");
          const replacement = `for (const [route, target] of [["phase-4", "/command/sales"], ["phase-5", "/command/engineering"], ["phase-6", "/command/operations"], ["phase-6a", "/command/epr-execution"], ["management-intelligence", "/command"]]) {
            const aliasSource = read(\`src/routes/command/\${route}.tsx\`);
            assert.ok(aliasSource.includes(\`redirect({ to: "\${target}" })\`), \`\${route} must remain a compatibility redirect\`);
          }

          const ops =`;
          const pattern = /for \(const \[route, target\] of \[\["phase-4"[\s\S]*?\n\}\n\nconst ops =/;
          if (!pattern.test(source)) throw new Error("generated route alias assertion block not found");
          source = source.replace(pattern, replacement);

          const lines = source.split("\n");
          const inventoryAssertion = lines.findIndex((line) => line.includes("assert.match(inventoryNav,"));
          if (inventoryAssertion < 0) throw new Error("generated inventory ledger route assertion not found");
          lines.splice(
            inventoryAssertion,
            1,
            'assert.ok(inventoryNav.includes(\'to="/command/inventory-ledgers/$ledger"\'));',
            'assert.ok(inventoryNav.includes(\'params={{ ledger: "components" }}\'));',
            'assert.ok(inventoryNav.includes(\'search={{ sku: undefined }}\'));',
          );
          writeFileSync(checkPath, lines.join("\n"), "utf8");

          const navPath = "src/components/inventory-workspace-nav.tsx";
          let nav = readFileSync(navPath, "utf8");
          const oldNav = '<Link to="/command/inventory-ledgers/components" className="hover:text-accent">';
          const newNav = '<Link to="/command/inventory-ledgers/$ledger" params={{ ledger: "components" }} search={{ sku: undefined }} className="hover:text-accent">';
          if (!nav.includes(oldNav)) throw new Error("generated inventory breadcrumb target not found");
          nav = nav.replace(oldNav, newNav);
          writeFileSync(navPath, nav, "utf8");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Authentication invariant gate
        run: npm run check:auth -- --ci

      - name: Route invariant gate
        run: npm run check:routes

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Commit verified sanitation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-pr68-final-sanitization.mjs .github/workflows/pr68-final-sanitization.yml
          git add -A
          git diff --cached --check
          git commit -m "Sanitize legacy workflow routes and runtime contracts"
          git push origin HEAD:hotfix-auth-runtime-vibpe-2026-09-09
