name: VIBPE Optimizer Closure Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Governed optimizer closure contract
        run: node --test scripts/vibpe-optimizer-closure.test.mjs
      - name: Infeasibility witness diagnostics
        run: node --experimental-strip-types --test src/lib/advanced-planning-infeasibility.test.ts
      - name: Cloudflare lazy HiGHS startup boundary
        run: node --test scripts/cloudflare-highs-lazy-boundary.test.mjs
      - name: Cloudflare bundle reachability
        run: npm run typecheck
