name: HiGHS model fix

on:
  push:
    branches:
      - transformation/highs-runtime-integration

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[model-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transformation/highs-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add governed total production cap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/advanced-planning-math-model.ts')
          s = p.read_text()
          needle = '''  for (const productId of products) {\n    for (let period = 1; period <= H; period += 1) {\n      const terms: MathTerm[] = [];\n      for (let p = 1; p <= period; p += 1) addTerm(terms, v("PROD", productId, p), 1);\n      for (const demand of source.demands.filter((row) => row.productId === productId)) {\n        for (let delivery = demand.period; delivery <= period; delivery += 1) addTerm(terms, v("FULFILL", demand.id, delivery), -1);\n      }\n      addConstraint({ id: c("FG_CUMULATIVE", productId, period), sense: "ge", rhs: 0, terms, semantic: `cumulative finished-goods coverage ${productId} M${period}` });\n    }\n  }\n'''
          replacement = '''  for (const productId of products) {\n    for (let period = 1; period <= H; period += 1) {\n      const terms: MathTerm[] = [];\n      for (let p = 1; p <= period; p += 1) addTerm(terms, v("PROD", productId, p), 1);\n      for (const demand of source.demands.filter((row) => row.productId === productId)) {\n        for (let delivery = demand.period; delivery <= period; delivery += 1) addTerm(terms, v("FULFILL", demand.id, delivery), -1);\n      }\n      addConstraint({ id: c("FG_CUMULATIVE", productId, period), sense: "ge", rhs: 0, terms, semantic: `cumulative finished-goods coverage ${productId} M${period}` });\n    }\n    addConstraint({\n      id: c("PRODUCTION_TOTAL_CAP", productId),\n      sense: "le",\n      rhs: totalProductDemand(source, productId),\n      terms: Array.from({ length: H }, (_, index) => ({ variableId: v("PROD", productId, index + 1), coefficient: 1 })),\n      semantic: `total production cannot exceed governed demand for ${productId}`,\n    });\n  }\n'''
          if needle not in s:
              raise SystemExit('target compiler block not found')
          p.write_text(s.replace(needle, replacement))

          t = Path('src/lib/advanced-planning-math-model.test.ts')
          ts = t.read_text()
          marker = '''  const materialM1 = byId(model.constraints, "MATERIAL_CUMULATIVE__FRAME_M__1");\n'''
          insert = '''  const productionCap = byId(model.constraints, "PRODUCTION_TOTAL_CAP__BIKE_M");\n  assert.equal(productionCap.sense, "le");\n  assert.equal(productionCap.rhs, 8);\n  assert.equal(coefficient(productionCap, "PROD__BIKE_M__1"), 1);\n  assert.equal(coefficient(productionCap, "PROD__BIKE_M__2"), 1);\n\n'''
          if marker not in ts:
              raise SystemExit('target test marker not found')
          t.write_text(ts.replace(marker, insert + marker))
          PY
      - run: node --experimental-strip-types --test src/lib/advanced-planning-math-model.test.ts src/lib/advanced-planning-highs-adapter.test.ts
      - name: Commit verified model fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/advanced-planning-math-model.ts src/lib/advanced-planning-math-model.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Cap production at governed total demand [model-fix]"
          git push origin HEAD:transformation/highs-runtime-integration
