name: HiGHS lockfile refresh

on:
  push:
    branches:
      - transformation/highs-runtime-integration

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transformation/highs-runtime-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install highs@1.15.3 --save-exact --ignore-scripts
      - name: Commit deterministic dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Pin HiGHS 1.15.3 runtime [lockfile-refresh]"
          git push origin HEAD:transformation/highs-runtime-integration
