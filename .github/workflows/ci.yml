name: CI

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authentication invariant gate
        run: npm run check:auth -- --ci

      - name: Route invariant gate
        run: npm run check:routes

      - name: Login warp transition gate
        run: node --test scripts/login-warp-transition.test.mjs

      - name: Actuals evidence regression gate
        run: node --experimental-strip-types --test scripts/actuals-evidence-regression.test.mjs

      - name: Migration environment isolation gate
        run: node --test scripts/migration-environment.test.mjs

      - name: Session security policy gate
        run: node --experimental-strip-types --test scripts/session-security-policy.test.mjs

      - name: Concurrent session cap gate
        run: node --experimental-strip-types --test scripts/session-concurrency.test.mjs

      - name: Security boundary regression gate
        run: node --experimental-strip-types --test scripts/security-boundary-regression.test.mjs

      - name: Generate route tree and typecheck
        run: npm run typecheck

      - name: Client bundle invariant gate
        run: node scripts/check-client-bundle.mjs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
