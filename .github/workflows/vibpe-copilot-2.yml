name: VIBPE Co-Pilot 2 Deployment Gate

on:
  pull_request:
    paths:
      - 'src/lib/ibpe-copilot.ts'
      - 'src/lib/ibpe-scenario-lab.ts'
      - 'src/lib/vibpe-*.ts'
      - 'scripts/vibpe-*.mjs'
      - 'docs/VIBPE-*.md'
      - '.github/workflows/vibpe-copilot-2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Existing governed regression suite
        run: npm test

      - name: VIBPE Co-Pilot 2 regression suite
        run: >-
          node --test
          scripts/vibpe-copilot-2-intent.test.mjs
          scripts/vibpe-copilot-2-orchestration.test.mjs
          scripts/vibpe-copilot-2-package.test.mjs
          scripts/vibpe-evaluation-corpus.test.mjs
          scripts/vibpe-governed-context.test.mjs
          scripts/vibpe-optimiser.test.mjs
          scripts/vibpe-planning.test.mjs
          scripts/vibpe-session-and-knowledge.test.mjs
          scripts/vibpe-finance-compliance-engineering.test.mjs
          scripts/vibpe-ca-financial-planner.test.mjs
          scripts/vibpe-cycling-performance.test.mjs
          scripts/vibpe-indian-bike-fit.test.mjs
          scripts/vibpe-carbon-bike-designer.test.mjs

      - name: Autonomous VIBPE QA guardrails
        run: node --test scripts/vibpe-copilot-qa.test.mjs

      - name: Autonomous VIBPE governed-fixture QA
        run: node scripts/vibpe-copilot-qa-runner.mjs

      - name: Verify VIBPE QA audit output
        if: always()
        run: |
          test -d artifacts/vibpe-qa
          test -n "$(find artifacts/vibpe-qa -maxdepth 1 -type f -name 'vibpe-qa-*.json' -print -quit)"
          test -n "$(find artifacts/vibpe-qa -maxdepth 1 -type f -name 'vibpe-qa-*.md' -print -quit)"

      - name: Upload VIBPE QA cycle audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibpe-qa-cycle-audits
          path: artifacts/vibpe-qa/
          retention-days: 30
          if-no-files-found: error
