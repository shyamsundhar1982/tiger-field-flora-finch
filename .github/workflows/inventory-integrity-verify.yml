name: Inventory Integrity Verify

on:
  push:
    branches:
      - inventory-global-sku-integrity

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inventory and repository tests
        run: npm test
