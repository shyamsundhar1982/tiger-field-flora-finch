name: Temporary VYNDI Brand Rewrite

on:
  push:
    branches:
      - automation/vyndi-brand-rewrite

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rewrite branch
        uses: actions/checkout@v4
        with:
          ref: automation/vyndi-brand-rewrite
          fetch-depth: 0

      - name: Rewrite current runtime brand copy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.resolve('src');
          const textExtensions = new Set(['.ts', '.tsx', '.json']);
          const accentLegacyAllowlist = new Set([
            'src/lib/data/company.ts',
            'src/routes/command/design-philosophy.tsx',
            'src/lib/vibpe-vayu-drive-policy.ts',
            'src/routes/__root.tsx',
          ]);

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
                continue;
              }
              if (!textExtensions.has(path.extname(entry.name))) continue;

              const rel = path.relative(process.cwd(), full).replaceAll(path.sep, '/');
              let text = fs.readFileSync(full, 'utf8');
              const before = text;

              // Standalone old brand spelling only. This deliberately does not
              // match infrastructure identifiers such as VINDY_ADMIN_EMAILS.
              text = text.replace(/\bVINDY\b/g, 'VYNDI').replace(/\bVindy\b/g, 'VYNDI');

              // Preserve explicit historical-source records and classifiers.
              if (!accentLegacyAllowlist.has(rel)) {
                text = text.replace(/VéLOXIS/g, 'VYNDI');
              }

              if (text !== before) fs.writeFileSync(full, text);
            }
          }

          walk(root);
          NODE

      - name: Commit guarded rewrite
        run: |
          if git diff --quiet -- src; then
            echo "No runtime brand rewrite remaining."
            exit 0
          fi
          git config user.name "VYNDI Brand Rewrite"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "tmp(brand): apply guarded runtime source rewrite"
          git push origin HEAD:automation/vyndi-brand-rewrite
